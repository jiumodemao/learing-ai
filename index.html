<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#4f46e5">
  <title>多AI</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="header-text">
      <h1>多AI</h1>
      <span class="header-sub">AI 学习 · 变现陪跑</span>
    </div>
    <div class="header-right">
      <button class="auth-btn" id="auth-btn">登录</button>
    </div>
  </header>

  <main>
    <!-- 学习路径 -->
    <section id="tab-path" class="tab-panel active">
      <div id="path-root"></div>
    </section>

    <!-- AI 助教 -->
    <section id="tab-tutor" class="tab-panel">
      <div class="card chat-card">
        <div class="chat-messages" id="chat-messages">
          <div class="msg-row tutor">
            <div class="avatar">小</div>
            <div class="bubble md-body">你好！我是你的 AI 助教「小多」。登录后你可以随时问我：讲解概念、出题测验、就业变现建议，我都会陪你一步步来。</div>
          </div>
        </div>
        <div class="chat-tools">
          <label class="provider-label">模型</label>
          <select id="tutor-provider">
            <option value="gemini">Gemini（默认）</option>
            <option value="deepseek">DeepSeek</option>
          </select>
        </div>
        <div class="chat-input-row">
          <input type="text" id="chat-input" placeholder="向小多提问…">
          <button class="btn send-btn" id="chat-send">发送</button>
        </div>
      </div>
    </section>

    <!-- 热点日报 -->
    <section id="tab-news" class="tab-panel">
      <div id="news-root"></div>
    </section>

    <!-- 笔记（第二大脑） -->
    <section id="tab-notes" class="tab-panel">
      <div class="card">
        <h2 class="card-title">随手记</h2>
        <p class="muted">想到什么就记什么，10 秒一条，整理交给 AI</p>
        <textarea id="note-input" rows="2" placeholder="例如：今天看到一句话——写作是思考的落地"></textarea>
        <button class="btn primary" id="note-add">记下</button>
      </div>
      <div class="card">
        <div class="notes-tools">
          <input id="note-search" placeholder="🔍 关键词搜索我的笔记">
          <button class="mini-btn" id="note-organize">✨ AI 整理</button>
        </div>
        <div class="note-review md-body" id="note-review"></div>
      </div>
      <div class="card">
        <h2 class="card-title">问我的笔记</h2>
        <div class="chat-input-row">
          <input type="text" id="note-ask-input" placeholder="例如：我记过什么关于健身的？">
          <button class="btn send-btn" id="note-ask-btn">问</button>
        </div>
        <div class="note-ask-result md-body" id="note-ask-result"></div>
      </div>
      <div class="card">
        <h2 class="card-title">全部笔记</h2>
        <ul class="note-list" id="note-list"></ul>
      </div>
    </section>

    <!-- 知识库管理（仅管理员可见） -->
    <section id="tab-admin" class="tab-panel">
      <div class="card">
        <h2 class="card-title">知识库管理（仅你可见）</h2>
        <p class="muted">在这里调整课程内容，保存后立即生效。也可以一键导出为 md 文件，在本地用编辑器继续修改。</p>
        <button class="btn" id="kb-export">导出全部为 md 文件</button>
      </div>
      <div id="admin-root"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-tab="path">
      <svg viewBox="0 0 24 24" width="21" height="21"><path d="M4 19l4-4 4 3 8-8M16 6h4v4" stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="5" r="1.6" fill="currentColor"/><circle cx="18" cy="19" r="1.6" fill="currentColor"/></svg>
      <span>学习路径</span>
    </button>
    <button class="tab" data-tab="tutor">
      <svg viewBox="0 0 24 24" width="21" height="21"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z" stroke="currentColor" fill="none" stroke-width="1.8" stroke-linejoin="round"/><circle cx="9" cy="12" r="1.3" fill="currentColor"/><circle cx="13" cy="12" r="1.3" fill="currentColor"/><circle cx="17" cy="12" r="1.3" fill="currentColor"/></svg>
      <span>AI 助教</span>
    </button>
    <button class="tab" data-tab="news">
      <svg viewBox="0 0 24 24" width="21" height="21"><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H13L13 2z" stroke="currentColor" fill="none" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span>热点</span>
    </button>
    <button class="tab" data-tab="notes">
      <svg viewBox="0 0 24 24" width="21" height="21"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" fill="none" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span>笔记</span>
    </button>
    <button class="tab" data-tab="admin" id="admin-nav" hidden>
      <svg viewBox="0 0 24 24" width="21" height="21"><path d="M17 3l4 4L8 20l-5 1 1-5L17 3z" stroke="currentColor" fill="none" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>知识库</span>
    </button>
  </nav>

  <!-- 登录弹窗 -->
  <div class="modal" id="auth-modal" hidden>
    <div class="modal-card">
      <button class="modal-close" id="auth-close">×</button>
      <h2 id="auth-title">登录多AI</h2>
      <p class="muted">登录后学习进度与聊天记录会同步到云端，手机电脑通用</p>
      <input type="text" id="auth-email" placeholder="账号（直接填用户名即可）" autocomplete="username">
      <input type="password" id="auth-password" placeholder="密码（至少 6 位）" autocomplete="current-password">
      <button class="btn primary" id="auth-submit">登录</button>
      <button class="btn link" id="auth-switch">没有账号？注册一个</button>
      <div class="auth-error" id="auth-error"></div>
    </div>
  </div>

  <script src="js/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="js/marked.min.js"></script>
  <script src="js/purify.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
